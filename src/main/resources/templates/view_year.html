<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>年間支出</title>
</head>
<body>	
	<table>
			<caption th:text="${year}">当月</caption>
			<thead>
				<tr>
					<th>項目</th>
					<th>金額</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="paydata ${pay_data}">
					<td th:text="${paydata.type}"></td>
					<td th:text="${paydata.price}"></td>
				</tr>
			</tbody>
		</table>
	
	<button onclick="location.href='main'">当月支出</button>
	<button onclick="location.href='viewMonth'">月別支出</button>
	<button onclick="location.href='compareData'">支出比較</button>
	<button onclick="location.href='configUser'">ユーザー設定</button>
	
	<p th:if="payment_data = null">warning</p>
	<p th:unless ="payment_data = null"></p>
</body>
</html>
